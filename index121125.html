<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Dans le <head> de index.html -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<!-- Juste avant la fermeture du </body> -->
<script type="text/javascript">
    // Initialisation EmailJS avec votre Public Key
    emailjs.init("QvP4ltdzywwg7IolM");
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bijoux ChouChou – Accueil</title>

  <!-- 🎨 Style principal -->
  <link rel="stylesheet" href="assets/style.css">

  <!-- ✉️ Librairie EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
</head>
<body>
  <!-- 🏷️ En-tête du site -->
  <header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding:16px;">
      <h1 class="site-title">Bijoux ChouChou</h1>
      <div id="cart-icon" style="display:flex;align-items:center;gap:8px;">
        <a href="panier.html" style="text-decoration:none;color:inherit;">
          🛍️ Panier (<span id="cart-count">0</span>)
        </a>
      </div>
    </div>
  </header>

  <!-- 💎 Section produits -->
  <main class="container" style="padding:24px;">
    <section id="products-section">
      <h2>Nos Bijoux</h2>
      <!-- Zone dynamique d'affichage des produits (gérée par script.js) -->
      <div id="products-grid" class="products-grid"></div>
    </section>
  </main>

  <!-- ✨ Bouton flottant “Sur mesure” -->
  <button id="custom-order-btn" aria-label="Commande sur mesure" style="
    position: fixed;
    bottom: 80px;
    right: 20px;
    background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,152,0,0.3);
    z-index: 998;
    display: flex;
    align-items: center;
    gap: 8px;">
    ✨ Sur mesure
  </button>

  <!-- 🧠 Script principal -->
  <script src="assets/script.js"></script>

  <!-- Petit comportement optionnel du bouton Sur-Mesure -->
  <script>
    document.getElementById("custom-order-btn").addEventListener("click", () => {
      alert("💎 Contactez-nous pour une création sur mesure !");
    });
  </script>
</body>
</html>
