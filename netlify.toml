#############################################
# NETLIFY CONFIG — Love Mon Bijou (Stripe)
#############################################

# Build (ton site statique)
[build]
  publish = "."                  # racine de ton site
  command = "echo 'Static site'" # inutile de builder, OK

# Functions (Stripe)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"       # parfait pour Stripe

# Dev local (netlify dev)
[dev]
  publish = "."
  port = 8888                    # ton port actuel
  functions = "netlify/functions"
  command = ""                   # rien à builder
  
# Headers (CORS permis pour appels JS vers functions)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# En option : permettre CORS global (ton ancien réglage)
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
